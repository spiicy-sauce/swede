[workspace]
resolver = "2"
members = [
    "tree-sitter-swede",
    "crates/kitchen-units",
    "crates/swede-syntax",
    "crates/swede-semantics",
    "crates/swede-render",
    "crates/swede-schedule",
    "crates/swede-fmt",
    "crates/swede-scale",
    "crates/swede-analysis",
    "crates/swede-lsp",
    "crates/swede-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tree-sitter = "0.24"
tree-sitter-swede = { path = "tree-sitter-swede" }
swede-syntax = { path = "crates/swede-syntax" }
swede-semantics = { path = "crates/swede-semantics" }
swede-render = { path = "crates/swede-render" }
swede-schedule = { path = "crates/swede-schedule" }
swede-fmt = { path = "crates/swede-fmt" }
swede-scale = { path = "crates/swede-scale" }
swede-analysis = { path = "crates/swede-analysis" }
kitchen-units = { path = "crates/kitchen-units" }
lsp-types = "0.94"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
